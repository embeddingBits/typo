{{ $dateFormat := site.Params.listDateFormat | default "22 Jan 2006" }}
<div class="post-line">
    {{ if .Param "showListDate" | default true }}
        <p class="line-date">
            {{ .Date | time.Format $dateFormat }}
        </p>
    {{ end }}
    <div>
        <p class="line-title">
            <a href="{{ .RelPermalink }}">
                {{ .Title }}
            </a>
        </p>
        {{ if site.Params.listSummaries }}
        <p class="line-summary">{{ .Summary }}</p>
        {{ end }}
    </div>
</div>
